# XcodeGen spec — setup.sh turns this into SleepOnIt.xcodeproj.
# BUNDLE_PREFIX is filled in by setup.sh (a unique ID just for you).
name: SleepOnIt
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SleepOnIt:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.sleeponit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sleep On It
        AppGroupID: group.${BUNDLE_PREFIX}.sleeponit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/SleepOnIt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.${BUNDLE_PREFIX}.sleeponit
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.sleeponit.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Sleep On It
        AppGroupID: group.${BUNDLE_PREFIX}.sleeponit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.${BUNDLE_PREFIX}.sleeponit
